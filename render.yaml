services:
  - type: web
    name: labsync-staging
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=backend && npm run build --workspace=frontend
    startCommand: npm start --workspace=backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_FRONTEND
        value: "true"
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
